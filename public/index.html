<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a2b"><title>نادي طب الطوارئ | كلية الغد – جدة</title><link rel="icon" href="/assets/official-logo.png"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root{--bg:#f4f7fa;--surface:#ffffff;--panel:#f1f6fa;--line:#dce7ec;--text:#162c42;--sub:#607488;--blue:#176d9e;--green:#188a83;--red:#b74754;--navy:#0b2841;--shadow:0 14px 36px rgba(21,52,78,.065)}*{box-sizing:border-box}
html{scroll-behavior:smooth}body{font:15px 'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.85}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #57a5ca;outline-offset:2px}button:hover{transform:translateY(-1px)}
.top{height:92px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px max(24px,calc((100vw - 1430px)/2));background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 3px 26px #1739550b}.brand{display:flex;align-items:center;gap:13px;min-width:235px}.brand img{width:64px;height:64px;object-fit:contain;background:white;border-radius:15px;padding:4px;border:1px solid #e1e9ee}.brand strong{display:block;font-size:19px;font-weight:700;line-height:1.4}.brand small{color:var(--sub);font-size:11px;line-height:1.4;display:block;margin-top:4px}.links{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.btn{padding:10px 18px;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:12px;font-weight:600}.links .btn{border-color:transparent;background:transparent}.links .btn:hover{background:#eaf3f7}.btn:hover{border-color:#8bb5c8}.btn.primary{background:linear-gradient(125deg,#157ea9,#158b82);border:0;color:#fff;box-shadow:0 7px 20px #077c8130}.btn.red{color:var(--red)}
.layout{max-width:1430px;margin:auto;padding:30px 24px;display:grid;grid-template-columns:257px minmax(0,1fr);gap:25px}.layout.noside{grid-template-columns:minmax(0,1fr)}.layout main{min-width:0}.side{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:18px;height:max-content;position:sticky;top:119px;max-height:calc(100vh - 137px);overflow:auto}.side h4{margin:16px 9px 9px;color:var(--green);font-size:12px;letter-spacing:.3px}.side button{width:100%;text-align:right;margin:2px 0;background:transparent;border-color:transparent;font-size:13px}.side button.active{background:#e8f4f4;border-color:#bcdedb;color:#08776d}.side.hidden{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:23px;padding:28px;margin-bottom:21px;box-shadow:var(--shadow)}.card h2{font-size:25px;margin:0 0 18px;letter-spacing:-.4px}.hero{display:flex;gap:36px;align-items:center;justify-content:space-between;min-height:475px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 10% 0%,#1c69718c,transparent 40%),linear-gradient(120deg,#081d33,#0a3151 66%,#0c4d58);border:0;color:#fff;padding:clamp(30px,5vw,65px)}.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 110px,#ffffff06 111px 112px);z-index:-1}.hero::after{content:'';position:absolute;width:420px;height:420px;border:1px solid #ffffff18;border-radius:50%;left:-120px;bottom:-250px;box-shadow:0 0 0 68px #ffffff07,0 0 0 134px #ffffff04;z-index:-1}.hero>div{max-width:660px}.hero img{height:min(29vw,275px);width:min(29vw,275px);min-width:190px;object-fit:contain;background:#fff;border:7px solid #ffffff55;padding:20px;border-radius:30px;box-shadow:0 22px 70px #0005}.hero h1{font-size:clamp(37px,5.3vw,72px);line-height:1.45;margin:8px 0 6px;color:#fff;font-weight:700;letter-spacing:-1.7px}.hero p{font-size:16px;max-width:630px}.hero .muted{color:#cadfe8}.hero .tag{color:#7de1d2;font-weight:700;font-size:13px;letter-spacing:2px}.hero .btn{background:#ffffff15;border-color:#ffffff60;color:#fff}.hero .btn.primary{background:#fff;color:#0b4355;box-shadow:none}.hero .row{margin-top:24px}.muted{color:var(--sub)}.tag{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}.mini{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;overflow:hidden}.mini h3{margin:0 0 10px}.count{font-size:34px;color:var(--green);font-weight:700}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}.wide{grid-column:1/-1}label{font-size:13px;color:var(--sub);display:block;margin-bottom:5px;font-weight:600}input,textarea,select{width:100%;border-radius:12px;padding:12px 14px;background:#fafcfd;border:1px solid #d5e2e9;color:var(--text)}textarea{min-height:115px;resize:vertical}.pill{display:inline-block;border:1px solid #b2d8d4;background:#e3f4f2;color:#176b65;border-radius:100px;font-size:12px;padding:3px 11px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.item:last-child{border-bottom:0}.item strong{display:block}.item p{margin:5px 0;color:var(--sub);white-space:pre-line}.media{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#eaf1f5}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{padding:7px 10px;font-size:12px}.notice{color:#28536b;background:#e7f2f7;padding:15px;border-radius:12px}.alert{position:fixed;bottom:20px;left:20px;z-index:9;max-width:420px;background:#0f645b;color:#fff;border:1px solid #47ceab;padding:12px 18px;border-radius:13px;box-shadow:0 5px 40px #0003}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}.checks label{display:flex;align-items:center;gap:8px;color:var(--text)}.checks input{width:auto}.name{font-size:25px;font-weight:800;color:var(--green)}details summary{cursor:pointer;font-weight:700}main>.card:not(.hero){animation:up .32s ease both}@keyframes up{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1060px){.links{display:none}.layout{padding:16px}.top{padding:10px 18px}}@media(max-width:900px){.layout{display:block}.side{position:static;margin-bottom:18px;max-height:none}.top{height:auto;min-height:80px}.hero{flex-direction:column-reverse;text-align:center;padding:35px 22px;min-height:unset}.hero img{height:178px;width:178px;min-width:unset}.hero h1{font-size:38px}.hero .row{justify-content:center}.hero p{font-size:14px}.card{padding:18px;border-radius:18px}.brand strong{font-size:16px}.brand small{font-size:10px}.brand img{width:51px;height:51px}.top .row .btn{font-size:12px;padding:8px}.grid{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
